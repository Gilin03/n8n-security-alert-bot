<section id="denied-view" class="hidden auth-layout">
  <div class="panel" style="padding:36px 24px;text-align:center"><p class="eyebrow">ACCESS GATE</p><div style="font-size:42px;margin-bottom:10px" aria-hidden="true">◌</div><h2 id="denied-title" class="page-title" style="font-size:28px">접근 권한이 없습니다</h2><p id="denied-msg" class="page-subtitle">이 페이지는 등급 제한이 걸려 있습니다.</p><div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:24px"><div class="panel" style="padding:12px 18px;box-shadow:none;background:var(--amber-soft);border-color:#f4df9e"><div class="help-text">필요 등급</div><strong id="denied-required">골드</strong></div><span style="color:var(--muted)">→</span><div class="panel" style="padding:12px 18px;box-shadow:none"><div class="help-text">현재 등급</div><strong id="denied-current">비로그인</strong></div></div><div class="form-actions" style="justify-content:center"><a href="/" class="btn btn-primary">게시판으로 돌아가기</a><a id="denied-login" href="/" class="btn btn-quiet hidden">로그인하러 가기</a></div><p class="page-note">등급이 필요하면 관리자에게 요청하세요.</p></div>
</section>

<script>
  const ROLE_LABEL = {user:'일반',gold:'골드',admin:'관리자'};
  const roleName = r => ROLE_LABEL[r] || r || '비로그인';
  function showDenied({required='gold',current=null,message=''}={}) { const denied = document.getElementById('denied-view'); const protectedView = document.getElementById('protected-view'); if (protectedView) protectedView.classList.add('hidden'); const anonymous = !current; document.getElementById('denied-title').textContent = anonymous ? '로그인이 필요합니다' : '접근 권한이 없습니다'; document.getElementById('denied-msg').textContent = message || (anonymous ? `이 페이지는 ${roleName(required)} 등급 이상만 볼 수 있습니다. 먼저 로그인해 주세요.` : `이 페이지는 ${roleName(required)} 등급 이상만 볼 수 있습니다.`); document.getElementById('denied-required').textContent = roleName(required); document.getElementById('denied-current').textContent = roleName(current); document.getElementById('denied-login').classList.toggle('hidden', !anonymous); denied.classList.remove('hidden'); }
  function showProtected() { document.getElementById('denied-view').classList.add('hidden'); const protectedView = document.getElementById('protected-view'); if (protectedView) protectedView.classList.remove('hidden'); }
</script>
